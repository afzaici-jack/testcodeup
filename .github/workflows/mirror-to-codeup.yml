name: Mirror to Codeup

on:
  push:
    branches: ['**']
    tags: ['**']

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Codeup
        env:
          # 形如 codeup.aliyun.com/<组织ID>/<分组>/testcodeup.git,不带 https:// 和凭证
          CODEUP_REPO: codeup.aliyun.com
          CODEUP_USERNAME: feng.ao-UuHjt
          CODEUP_TOKEN: pt-iBLRHoWDTynnQxLoRs8yRxjS_42c5b885-5190-41d6-8bcc-d5807f69da98
        run: |
          DST="https://${CODEUP_USERNAME}:${CODEUP_TOKEN}@${CODEUP_REPO#https://}"
          git push --force "$DST" "HEAD:${GITHUB_REF}"
